{% extends "base.html" %}
{% block title %}Page Not Found — FitTrack{% endblock %}
{% block body %}
<div style="min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px">
  <a href="{{ url_for('index') }}" style="display:flex;align-items:center;gap:10px;font-family:var(--ff-display);font-size:22px;font-weight:700;margin-bottom:48px">
    <span class="nav-brand-mark" style="width:32px;height:32px;background:var(--c-lime);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--c-text);font-size:18px;font-weight:700">F</span>
    FitTrack
  </a>
  <div style="font-family:var(--ff-display);font-size:120px;font-weight:700;line-height:1;color:var(--c-border)">404</div>
  <h1 style="font-family:var(--ff-display);font-size:40px;font-weight:700;margin-top:16px">Page not found.</h1>
  <p style="font-size:16px;color:var(--c-sub);margin-top:12px;max-width:360px">That URL doesn't exist. Check the link or head back to your dashboard.</p>
  <div style="display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;justify-content:center">
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to dashboard</a>
    <a href="{{ url_for('index') }}" class="btn btn-ghost">Home</a>
  </div>
</div>
{% endblock %}
